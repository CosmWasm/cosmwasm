[workspace]
members = ["packages/*"]
exclude = ["contracts"]

resolver = "2"

[workspace.package]
version = "2.3.5-rc.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/CosmWasm/cosmwasm"

[workspace.dependencies]
cosmwasm-core = { path = "./packages/core", version = "=2.3.5-rc.0" }
cosmwasm-crypto = { path = "./packages/crypto", version = "=2.3.5-rc.0" }
cosmwasm-derive = { path = "./packages/derive", version = "=2.3.5-rc.0" }
cosmwasm-schema = { path = "./packages/schema", version = "=2.3.5-rc.0" }
cosmwasm-schema-derive = { path = "./packages/schema-derive", version = "=2.3.5-rc.0" }
cosmwasm-std = { path = "./packages/std", version = "=2.3.5-rc.0", default-features = false }
cosmwasm-vm = { path = "./packages/vm", version = "=2.3.5-rc.0" }
cosmwasm-vm-derive = { path = "./packages/vm-derive", version = "=2.3.5-rc.0" }
cosmwasm-check = { path = "./packages/check", version = "=2.3.5-rc.0" }
schemars = "0.8.4"
serde = { version = "1.0.192", default-features = false }
serde_json = "1.0.140"
thiserror = "1.0.26"
