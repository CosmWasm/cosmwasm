[package]
name = "integration-reflect"
version = "0.0.0"
authors = ["Dariusz Depta <DariuszDepta@users.noreply.github.com>"]
description = "Reflect messages to use for test cases - based on cw-mask"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
path = "../src/lib.rs"

[dependencies]
reflect = { path = ".." }
cosmwasm-schema = { path = "../../../packages/schema" }
cosmwasm-std = { path = "../../../packages/std", default-features = false, features = ["cosmwasm_2_2", "staking", "stargate", "std"] }
schemars = "0.8.12"
serde = { version = "1.0.103", default-features = false, features = ["derive"] }
thiserror = "1.0.26"

[dev-dependencies]
cosmwasm-vm = { path = "../../../packages/vm", default-features = false, features = ["stargate"] }
backtrace = "=0.3.74" # This fixes the last version that compiles with 1.81.0
