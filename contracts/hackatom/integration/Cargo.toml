[package]
name = "integration-hackatom"
version = "0.0.0"
authors = ["Dariusz Depta <DariuszDepta@users.noreply.github.com>"]
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
path = "../src/lib.rs"

[dependencies]
hackatom = { path = ".." }
cosmwasm-schema = { path = "../../../packages/schema" }
cosmwasm-std = { path = "../../../packages/std", default-features = false, features = ["cosmwasm_2_2", "std"] }
schemars = "0.8.12"
serde = { version = "1.0.103", default-features = false, features = ["derive"] }
sha2 = "0.10"
thiserror = "1.0.26"

[dev-dependencies]
cosmwasm-vm = { path = "../../../packages/vm", default-features = false }
backtrace = "=0.3.74" # This fixes the last version that compiles with 1.81.0
