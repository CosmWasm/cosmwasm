[package]
name = "integration-cyberpunk"
version = "0.0.0"
authors = ["Dariusz Depta <DariuszDepta@users.noreply.github.com>"]
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
path = "../src/lib.rs"

[dependencies]
cyberpunk = { path = ".." }
cosmwasm-schema = { version = "=3.0.11-rc.0" }
cosmwasm-std = { version = "=3.0.11-rc.0", default-features = false, features = ["cosmwasm_1_3", "std"] }
rust-argon2 = "2.1"
thiserror = "1.0.26"

[dev-dependencies]
cosmwasm-vm = { version = "=3.0.11-rc.0", default-features = false }
tempfile = "3.1.0"

