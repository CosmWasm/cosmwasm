[package]
name = "integration-empty"
version = "0.0.0"
authors = ["Dariusz Depta <DariuszDepta@users.noreply.github.com>"]
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
path = "../src/lib.rs"

[dependencies]
empty = { path = ".." }
cosmwasm-schema = { version = "=3.0.10-rc.4" }
cosmwasm-std = { version = "=3.0.10-rc.4", features = ["iterator"] }
schemars = "0.8.12"

[dev-dependencies]
cosmwasm-vm = { version = "=3.0.10-rc.4", default-features = false, features = ["iterator"] }
