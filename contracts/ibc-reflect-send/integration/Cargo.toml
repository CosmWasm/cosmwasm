[package]
name = "integration-ibc-reflect-send"
version = "0.0.0"
authors = ["Dariusz Depta <DariuszDepta@users.noreply.github.com>"]
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
path = "../src/lib.rs"

[dependencies]
ibc-reflect-send = { path = ".." }
cosmwasm-schema = { version = "=3.0.10" }
cosmwasm-std = { version = "=3.0.10", features = ["iterator", "staking", "stargate"] }
schemars = "0.8.12"
serde = { version = "1.0.103", default-features = false, features = ["derive"] }

[dev-dependencies]
cosmwasm-vm = { version = "=3.0.10", default-features = false, features = ["iterator", "stargate"] }
