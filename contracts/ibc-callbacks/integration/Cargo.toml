[package]
name = "integration-ibc-callbacks"
version = "0.0.0"
authors = ["Dariusz Depta <DariuszDepta@users.noreply.github.com>"]
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
path = "../src/lib.rs"

[dependencies]
ibc-callbacks = { path = ".." }
cosmwasm-schema = { version = "=2.2.11-rc.0" }
cosmwasm-std = { version = "=2.2.11-rc.0", features = ["iterator", "stargate"] }
schemars = "0.8.3"
serde = { version = "1.0.103", default-features = false, features = ["derive"] }

[dev-dependencies]
cosmwasm-vm = { version = "=2.2.11-rc.0", default-features = false, features = ["iterator", "stargate"] }
backtrace = "=0.3.74" # This fixes the last version that compiles with 1.81.0

[patch.crates-io]
cosmwasm-std = { path = "../../../packages/std", version = "=2.2.11-rc.0" }
cosmwasm-schema = { path = "../../../packages/schema", version = "=2.2.11-rc.0" }
cosmwasm-vm = { path = "../../../packages/vm", version = "=2.2.11-rc.0" }
