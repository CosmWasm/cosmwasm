[package]
name = "integration-crypto-verify"
version = "0.0.0"
authors = ["Dariusz Depta <DariuszDepta@users.noreply.github.com>"]
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
path = "../src/lib.rs"

[dependencies]
crypto-verify = { path = ".." }
base64 = "0.22.0"
cosmwasm-schema = { version = "=2.3.6" }
cosmwasm-std = { version = "=2.3.6", features = ["cosmwasm_2_1", "iterator"] }
hex = "0.4"
p256 = { version = "0.13.2", default-features = false, features = ["alloc", "ecdsa"] }
rlp = "0.5"
schemars = "0.8.12"
serde = { version = "1.0.103", default-features = false, features = ["derive"] }
sha2 = "0.10"
sha3 = "0.10"

[dev-dependencies]
cosmwasm-vm = { version = "=2.3.6", default-features = false, features = ["iterator"] }
hex-literal = "0.4.1"

