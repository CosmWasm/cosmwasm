[package]
name = "integration-ibc-reflect"
version = "0.0.0"
authors = ["Dariusz Depta <DariuszDepta@users.noreply.github.com>"]
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
path = "../src/lib.rs"

[dependencies]
ibc-reflect = { path = ".." }
cosmwasm-schema = { version = "=2.2.10-rc.4" }
cosmwasm-std = { version = "=2.2.10-rc.4", features = ["cosmwasm_2_2", "iterator", "stargate"] }
schemars = "0.8.12"
serde = { version = "1.0.103", default-features = false, features = ["derive"] }

[dev-dependencies]
cosmwasm-vm = { version = "=2.2.10-rc.4", default-features = false, features = ["iterator", "stargate"] }
backtrace = "=0.3.74" # This fixes the last version that compiles with 1.81.0
