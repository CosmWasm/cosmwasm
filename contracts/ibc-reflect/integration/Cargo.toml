[package]
name = "integration-ibc-reflect"
version = "0.0.0"
authors = ["Dariusz Depta <DariuszDepta@users.noreply.github.com>"]
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
path = "../src/lib.rs"

[dependencies]
ibc-reflect = { path = ".." }
cosmwasm-schema = { path = "../../../packages/schema" }
cosmwasm-std = { path = "../../../packages/std", features = ["cosmwasm_2_2", "iterator", "stargate"] }
schemars = "0.8.12"
serde = { version = "1.0.103", default-features = false, features = ["derive"] }

[dev-dependencies]
cosmwasm-vm = { path = "../../../packages/vm", default-features = false, features = ["iterator", "stargate"] }
