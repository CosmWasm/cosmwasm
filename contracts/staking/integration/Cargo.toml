[package]
name = "integration-staking"
version = "0.0.0"
authors = ["Dariusz Depta <DariuszDepta@users.noreply.github.com>"]
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
path = "../src/lib.rs"

[dependencies]
staking = { path = ".." }
cosmwasm-schema = { version = "=2.3.6" }
cosmwasm-std = { version = "=2.3.6", default-features = false, features = ["staking", "std"] }
schemars = "0.8.12"
serde = { version = "1.0.103", default-features = false, features = ["derive"] }
snafu = "0.8.2"

[dev-dependencies]
cosmwasm-vm = { version = "=2.3.6", default-features = false, features = ["staking"] }

