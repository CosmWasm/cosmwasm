[package]
name = "cosmwasm-derive"
version = { workspace = true }
authors = ["Simon Warta <webmaster128@users.noreply.github.com>"]
description = "A package for auto-generated code used for CosmWasm contract development. This is shipped as part of cosmwasm-std. Do not use directly."
repository = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
# Contracts are built with Rust 1.81 (the last version without reference-types;
# see Taskfile.yml / devtools/check-contracts.sh), so this crate must keep
# compiling on that version.
rust-version = "1.81"
readme = "README.md"

[lib]
proc-macro = true

[features]
default = []

[dependencies]
proc-macro2 = "1.0.79"
quote = "1.0.35"
syn = { version = "2", features = ["full"] }
