[package]
name = "cosmwasm-schema"
version = { workspace = true }
authors = [
    "Ethan Frey <ethanfrey@users.noreply.github.com>",
    "Simon Warta <webmaster128@users.noreply.github.com>",
]
description = "A dev-dependency for CosmWasm contracts to generate JSON Schema files."
repository = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
# Contracts are built with Rust 1.81 (the last version without reference-types;
# see Taskfile.yml / devtools/check-contracts.sh), so this crate must keep
# compiling on that version.
rust-version = "1.81"

[dependencies]
cosmwasm-schema-derive = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
anyhow = "1.0.57"
semver = "1"
tempfile = "3"
